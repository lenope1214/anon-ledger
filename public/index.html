<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거래장부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="stylesheet" href="style.css?v=1.23.0">
</head>
<body>
<header id="topbar">
  <h1>📒 거래장부</h1>
  <nav id="tabs">
    <button data-tab="companies">상호관리</button>
    <button data-tab="products">제품관리</button>
    <button data-tab="transactions" class="active">거래관리</button>
    <button data-tab="reports">집계</button>
    <button data-tab="settings">내 정보</button>
    <button data-tab="admin" id="tabAdminBtn" class="hidden">👑 관리자</button>
  </nav>
  <div class="topbar-right">
    <span id="verFooter" class="ver-footer"></span>
    <span id="whoami"></span>
    <button id="btnLogout">로그아웃</button>
  </div>
</header>

<main id="main"></main>

<div id="modal" class="overlay hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- 알림·확인 창 (브라우저 기본 alert/confirm 대신 쓰는 우리 창) -->
<div id="dlg" class="overlay hidden" aria-hidden="true">
  <div class="dlg-box" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgMsg">
    <div class="dlg-icon" id="dlgIcon" aria-hidden="true">❓</div>
    <h2 class="dlg-title" id="dlgTitle">확인</h2>
    <div class="dlg-msg" id="dlgMsg"></div>
    <div class="dlg-btns">
      <button type="button" id="dlgCancel">취소</button>
      <button type="button" id="dlgOk" class="primary">확인</button>
    </div>
  </div>
</div>

<div id="printOverlay" class="overlay hidden">
  <div class="print-wrap">
    <div class="print-toolbar">
      <button id="btnShareSheet">💬 카톡·문자로 보내기</button>
      <button id="btnDoPrint" class="primary">🖨 인쇄 / PDF 저장</button>
      <button id="btnClosePrint">닫기</button>
    </div>
    <div id="printSheet"></div>
  </div>
</div>

<div id="searchSheet" class="sheet-panel hidden">
  <div class="sheet-head">
    <div class="auth-tabs sheet-tabs">
      <button type="button" id="ssTabCompany" class="active">상호</button>
      <button type="button" id="ssTabProduct">제품</button>
    </div>
    <button type="button" id="ssClose" title="닫기 (ESC)">✕</button>
  </div>
  <input id="ssInput" placeholder="검색어 입력" autocomplete="off">
  <div id="ssResults" class="ss-results"></div>
  <p class="hint ss-hint">↑↓로 이동, Enter로 선택 — 선택하면 아래 입력 행에 바로 채워집니다. 상호 정보는 칸을 눌러 바로 고칠 수 있습니다.</p>
</div>

<div id="saveBar" class="hidden">
  <span id="saveBarInfo" class="save-bar-info"></span>
  <button type="button" id="saveBarBtn" class="primary">저장</button>
</div>

<div id="tourOverlay" class="hidden">
  <div id="tourSpot"></div>
  <div id="tourBox">
    <p id="tourStep" class="tour-step"></p>
    <h3 id="tourTitle"></h3>
    <p id="tourBody"></p>
    <div class="tour-actions">
      <button type="button" id="tourSkip" class="tour-skip">건너뛰기</button>
      <button type="button" id="tourPrev">이전</button>
      <button type="button" id="tourNext" class="primary">다음</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="app.js?v=1.23.0"></script>
</body>
</html>
