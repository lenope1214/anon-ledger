<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거래장부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="topbar-row">
    <h1>📒 거래장부</h1>
    <button id="btnLogout">로그아웃</button>
  </div>
  <nav id="tabs">
    <button data-tab="companies" class="active">상호관리</button>
    <button data-tab="products">제품관리</button>
    <button data-tab="transactions">거래관리</button>
    <button data-tab="settings">내 정보</button>
  </nav>
</header>

<main id="main"></main>

<div id="modal" class="overlay hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="printOverlay" class="overlay hidden">
  <div class="print-wrap">
    <div class="print-toolbar">
      <button id="btnDoPrint" class="primary">🖨 인쇄 / PDF 저장</button>
      <button id="btnClosePrint">닫기</button>
    </div>
    <div id="printSheet"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
