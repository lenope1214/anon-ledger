<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 거래장부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="stylesheet" href="style.css?v=1.22.1">
</head>
<body class="login-body">
<div class="card login-card">
  <h1 class="login-title">📒 거래장부</h1>
  <div class="auth-tabs">
    <button type="button" id="tabLogin" class="active">로그인</button>
    <button type="button" id="tabSignup">회원가입</button>
  </div>
  <form id="loginForm">
    <label>아이디<input id="username" required autocomplete="username" placeholder="예: hong123"></label>
    <label>비밀번호<input id="pw" type="password" required minlength="4" autocomplete="current-password"></label>
    <label id="pw2Label" class="hidden">비밀번호 확인<input id="pw2" type="password" autocomplete="new-password"></label>
    <p id="loginError" class="login-error hidden"></p>
    <button type="submit" class="primary login-btn" id="loginBtn">로그인</button>
  </form>
  <p class="hint login-hint" id="modeHint">계정이 없다면 [회원가입]으로 새 장부를 만드세요.<br>계정마다 완전히 분리된 자기 장부를 갖습니다.</p>
  <p id="verFooter" class="ver-footer"></p>
</div>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  let mode = 'login';

  try {
    const st = await fetch('/api/auth/status').then((r) => r.json());
    if (st.authed) { location.href = '/'; return; }
  } catch (e) { /* 서버 연결 실패 시 제출할 때 안내됨 */ }

  try {
    const last = localStorage.getItem('lastUsername');
    if (last) {
      $('#username').value = last;
      $('#pw').focus();
    }
  } catch (e) { /* localStorage 사용 불가 환경 */ }

  fetch('/api/version')
    .then((r) => r.json())
    .then((v) => { $('#verFooter').textContent = `거래장부 v${v.version} · ${v.commit}`; })
    .catch(() => {});

  function setMode(next) {
    mode = next;
    const signup = mode === 'signup';
    $('#tabLogin').classList.toggle('active', !signup);
    $('#tabSignup').classList.toggle('active', signup);
    $('#pw2Label').classList.toggle('hidden', !signup);
    $('#pw2').required = signup;
    $('#pw').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
    $('#loginBtn').textContent = signup ? '가입하고 시작하기' : '로그인';
    $('#modeHint').innerHTML = signup
      ? '아이디는 2~20자의 한글·영문·숫자, 비밀번호는 4자 이상입니다.<br>가입 후 관리자 승인을 받으면 이용할 수 있습니다.'
      : '계정이 없다면 [회원가입]으로 새 장부를 만드세요.<br>계정마다 완전히 분리된 자기 장부를 갖습니다.';
    $('#loginError').classList.add('hidden');
  }
  $('#tabLogin').addEventListener('click', () => setMode('login'));
  $('#tabSignup').addEventListener('click', () => setMode('signup'));

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#loginError');
    err.classList.add('hidden');
    if (mode === 'signup' && $('#pw').value !== $('#pw2').value) {
      err.textContent = '비밀번호가 서로 다릅니다.';
      err.classList.remove('hidden');
      return;
    }
    try {
      const res = await fetch(mode === 'signup' ? '/api/auth/signup' : '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('#username').value.trim(), password: $('#pw').value }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        try { localStorage.setItem('lastUsername', $('#username').value.trim()); } catch (e2) { /* 무시 */ }
        location.href = '/';
        return;
      }
      err.textContent = data.error || (mode === 'signup' ? '가입에 실패했습니다.' : '로그인에 실패했습니다.');
    } catch (e2) {
      err.textContent = '서버에 연결할 수 없습니다.';
    }
    err.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
